# Ultralytics YOLOv8 object detection model with P3/8 - P4/16 outputs
# Focused on small and medium object detection; P5/32 backbone retained for global context
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-p34.yaml' will call yolov8-p34.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n-p34 summary: 109 layers, 2,078,976 parameters, 2,078,960 gradients
  s: [0.33, 0.50, 1024] # YOLOv8s-p34 summary: 109 layers, 7,522,768 parameters, 7,522,752 gradients
  m: [0.67, 0.75, 768] # YOLOv8m-p34 summary: 145 layers, 18,651,296 parameters, 18,651,280 gradients
  l: [1.00, 1.00, 512] # YOLOv8l-p34 summary: 181 layers, 34,480,240 parameters, 34,480,224 gradients
  x: [1.00, 1.25, 512] # YOLOv8x-p34 summary: 181 layers, 53,847,104 parameters, 53,847,088 gradients

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  - [[15, 18], 1, Detect, [nc]] # Detect(P3, P4)
