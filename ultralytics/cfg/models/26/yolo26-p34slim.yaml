# Ultralytics YOLO26 object detection model with P3/8 - P4/16 outputs (slim neck)
# 在 yolo26-p34lite 基础上进一步压缩，面向单类别/中型目标/NCNN-ARM 速度优先部署
# 改动点：去掉 SPPF 后的 C3k2（原 #9）；neck 全部 C3k2 由 True 改为 False,0.25；P4 neck 支路 512->256
# 仍保留 Backbone 的 P5/SPPF 为 P4 提供全局上下文；检测头仍为 P3/P4 双尺度
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-p34slim.yaml' will call yolo26-p34slim.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 141 layers, 697,152 parameters, 697,152 gradients, 3.8 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 141 layers, 2,646,448 parameters, 2,646,448 gradients, 13.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 191 layers, 10,525,072 parameters, 10,525,072 gradients, 54.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 275 layers, 11,873,680 parameters, 11,873,680 gradients, 64.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 275 layers, 26,614,704 parameters, 26,614,704 gradients, 144.2 GFLOPs

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32 (1024->512)
  - [-1, 1, SPPF, [512, 5]] # 8 (去 shortcut；去掉其后 C3k2)

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4(512)->512+512
  - [-1, 2, C3k2, [256, False, 0.25]] # 11 P4 neck (原 512,True -> 256,False)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3(512)->256+512
  - [-1, 2, C3k2, [256, False, 0.25]] # 14 P3/8-small (原 True -> False)
  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4(256)->256+256
  - [-1, 2, C3k2, [256, False, 0.25]] # 17 P4/16-medium (原 512,True -> 256,False)
  - [[14, 17], 1, Detect, [nc]] # 18 Detect(P3, P4)
