# Ultralytics YOLO26 object detection model with P3/8 - P4/16 outputs (lite P5 context)
# 思路1：P5/32 上下文支路瘦身 —— 通道减半 + 去掉 C2PSA 注意力 + 用轻量 CSP 替代 C3k[True]
# 仍保留 Backbone 的 P5/SPPF 为 P4 提供全局上下文；检测头仍为 P3/P4 双尺度
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-p34lite.yaml' will call yolo26-p34lite.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 179 layers, 955,088 parameters, 955,088 gradients, 4.8 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 179 layers, 3,662,544 parameters, 3,662,544 gradients, 17.6 GFLOPs
  m: [0.50, 1.00, 512] # summary: 209 layers, 14,582,416 parameters, 14,582,416 gradients, 69.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 293 layers, 17,667,216 parameters, 17,667,216 gradients, 86.9 GFLOPs
  x: [1.00, 1.50, 512] # summary: 293 layers, 39,636,528 parameters, 39,636,528 gradients, 194.0 GFLOPs

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32 (slimmed: 1024 -> 512)
  - [-1, 1, SPPF, [512, 5]] # 8 (slimmed: 去掉 shortcut)
  - [-1, 1, C3k2, [512, False, 0.25]] # 9 (替代原 C3k2[True] + C2PSA)

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 18 (P4/16-medium)

  - [[15, 18], 1, Detect, [nc]] # Detect(P3, P4)
